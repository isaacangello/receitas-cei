<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Receitas CEI - Curso de Panificacao</title>
  <meta name="description" content="Receitas do curso de panificacao CEI de Quintino. Aprenda a fazer paes, bolos e doces artesanais.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
  <script type="module" crossorigin src="/assets/main-COUQ4O5x.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/module.esm-BtRUP2rk.js">
  <link rel="stylesheet" crossorigin href="/assets/main-DoQDK_e9.css">
</head>
<body class="bg-warm-gray min-h-screen" x-data x-init="$store.router.init()">

  <!-- NAVBAR -->
  <nav class="bg-primary text-white shadow-lg sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4">
      <div class="flex items-center justify-between h-16">
        <a href="#/home" class="flex items-center gap-2">
          <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
          </svg>
          <span class="font-display text-xl font-bold">Receitas CEI</span>
        </a>
        <div class="hidden md:flex items-center gap-6">
          <a href="#/home" class="hover:text-cream transition-colors">Inicio</a>
          <a href="#/receitas" class="hover:text-cream transition-colors">Receitas</a>
          <a href="#/sobre" class="hover:text-cream transition-colors">Sobre</a>
          <a href="#/contato" class="hover:text-cream transition-colors">Contato</a>
        </div>
        <button class="md:hidden" x-data="{ open: false }" @click="open = !open">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
          </svg>
          <div x-show="open" @click.away="open = false" class="absolute right-0 mt-2 w-48 bg-white rounded-lg shadow-xl py-2 z-50">
            <a href="#/home" class="block px-4 py-2 text-gray-800 hover:bg-cream">Inicio</a>
            <a href="#/receitas" class="block px-4 py-2 text-gray-800 hover:bg-cream">Receitas</a>
            <a href="#/sobre" class="block px-4 py-2 text-gray-800 hover:bg-cream">Sobre</a>
            <a href="#/contato" class="block px-4 py-2 text-gray-800 hover:bg-cream">Contato</a>
          </div>
        </button>
      </div>
    </div>
  </nav>

  <!-- PAGE: HOME -->
  <template x-if="$store.router.current === 'home'">
    <div>
      <!-- Hero -->
      <section class="relative bg-primary text-white py-20 overflow-hidden">
        <div class="absolute inset-0 bg-gradient-to-r from-primary-dark to-primary opacity-90"></div>
        <div class="relative max-w-6xl mx-auto px-4 text-center">
          <h1 class="font-display text-4xl md:text-6xl font-bold mb-4">Receitas do Curso de Panificacao</h1>
          <p class="text-xl text-cream mb-8 max-w-2xl mx-auto">Aprenda as receitas passadas em sala de aula no CEI de Quintino. Paes, bolos, broas e muito mais.</p>
          <a href="#/receitas" class="inline-block bg-accent hover:bg-primary-light text-white font-bold py-3 px-8 rounded-lg transition-colors">
            Ver Receitas
          </a>
        </div>
      </section>

      <!-- Receitas em Destaque -->
      <section class="max-w-6xl mx-auto px-4 py-16">
        <h2 class="font-display text-3xl font-bold text-primary mb-8 text-center">Receitas em Destaque</h2>
        <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-8">
          <template x-for="receita in $store.receitas.getAll().slice(0, 6)" :key="receita.id">
            <a :href="'#/receita/' + receita.id" class="bg-white rounded-xl shadow-md overflow-hidden hover:shadow-xl transition-shadow group">
              <div class="h-48 bg-gradient-to-br from-accent to-primary flex items-center justify-center">
                <svg class="w-16 h-16 text-white opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
                </svg>
              </div>
              <div class="p-6">
                <span class="text-xs font-semibold text-accent uppercase tracking-wide" x-text="receita.categoria"></span>
                <h3 class="font-display text-xl font-bold text-gray-900 mt-1 group-hover:text-primary transition-colors" x-text="receita.titulo"></h3>
                <p class="text-gray-600 mt-2 text-sm line-clamp-2" x-text="receita.descricao"></p>
              </div>
            </a>
          </template>
        </div>
        <div class="text-center mt-12">
          <a href="#/receitas" class="inline-block border-2 border-primary text-primary hover:bg-primary hover:text-white font-bold py-3 px-8 rounded-lg transition-colors">
            Ver Todas as Receitas
          </a>
        </div>
      </section>

      <!-- Categorias -->
      <section class="bg-white py-16">
        <div class="max-w-6xl mx-auto px-4">
          <h2 class="font-display text-3xl font-bold text-primary mb-8 text-center">Categorias</h2>
          <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <template x-for="cat in $store.receitas.getCategorias()" :key="cat">
              <a :href="'#/receitas?cat=' + cat" class="bg-cream rounded-xl p-6 text-center hover:bg-accent hover:text-white transition-colors group">
                <div class="text-3xl mb-2">
                  <span x-text="cat === 'Paes' ? '🍞' : cat === 'Bolos' ? '🎂' : cat === 'Broas' ? '🌽' : '🍝'"></span>
                </div>
                <h3 class="font-display font-bold text-lg" x-text="cat"></h3>
                <p class="text-sm opacity-75" x-text="$store.receitas.getByCategoria(cat).length + ' receitas'"></p>
              </a>
            </template>
          </div>
        </div>
      </section>
    </div>
  </template>

  <!-- PAGE: RECEITAS -->
  <template x-if="$store.router.current === 'receitas'">
    <div class="max-w-6xl mx-auto px-4 py-12">
      <h1 class="font-display text-4xl font-bold text-primary mb-8">Receitas</h1>

      <!-- Busca -->
      <div class="mb-8" x-data="{ query: '' }">
        <input type="text" x-model="query" placeholder="Buscar receitas..."
          class="w-full md:w-96 px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-accent focus:border-transparent outline-none"
          @input="$store.receitas.search(query)">
      </div>

      <!-- Filtro por categoria -->
      <div class="flex flex-wrap gap-3 mb-8">
        <button @click="window.location.hash = '#/receitas'"
          class="px-4 py-2 rounded-full text-sm font-semibold transition-colors"
          :class="!window.location.hash.includes('cat=') ? 'bg-primary text-white' : 'bg-white text-gray-700 hover:bg-gray-100'">
          Todas
        </button>
        <template x-for="cat in $store.receitas.getCategorias()" :key="cat">
          <button @click="window.location.hash = '#/receitas?cat=' + cat"
            class="px-4 py-2 rounded-full text-sm font-semibold transition-colors"
            :class="window.location.hash.includes('cat=' + cat) ? 'bg-primary text-white' : 'bg-white text-gray-700 hover:bg-gray-100'"
            x-text="cat">
          </button>
        </template>
      </div>

      <!-- Lista -->
      <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-8">
        <template x-for="receita in $store.receitas.getAll()" :key="receita.id">
          <a :href="'#/receita/' + receita.id" class="bg-white rounded-xl shadow-md overflow-hidden hover:shadow-xl transition-shadow group">
            <div class="h-40 bg-gradient-to-br from-accent to-primary flex items-center justify-center">
              <svg class="w-12 h-12 text-white opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
              </svg>
            </div>
            <div class="p-5">
              <span class="text-xs font-semibold text-accent uppercase tracking-wide" x-text="receita.categoria"></span>
              <h3 class="font-display text-lg font-bold text-gray-900 mt-1 group-hover:text-primary transition-colors" x-text="receita.titulo"></h3>
              <p class="text-gray-500 text-sm mt-1" x-text="receita.data"></p>
            </div>
          </a>
        </template>
      </div>
    </div>
  </template>

  <!-- PAGE: RECEITA INDIVIDUAL -->
  <template x-if="$store.router.current === 'receita'">
    <div class="max-w-4xl mx-auto px-4 py-12" x-data="{ receita: $store.receitas.getById($store.router.params.id) }">
      <template x-if="receita">
        <div>
          <a href="#/receitas" class="inline-flex items-center text-accent hover:text-primary mb-6 transition-colors">
            <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
            </svg>
            Voltar
          </a>

          <article class="bg-white rounded-2xl shadow-lg overflow-hidden">
            <div class="h-48 bg-gradient-to-br from-accent to-primary flex items-center justify-center">
              <svg class="w-20 h-20 text-white opacity-40" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
              </svg>
            </div>

            <div class="p-8">
              <div class="flex items-center gap-3 mb-4">
                <span class="bg-cream text-primary text-xs font-bold px-3 py-1 rounded-full" x-text="receita.categoria"></span>
                <span class="text-gray-400 text-sm" x-text="receita.data"></span>
              </div>

              <h1 class="font-display text-3xl md:text-4xl font-bold text-gray-900 mb-6" x-text="receita.titulo"></h1>

              <!-- Ingredientes -->
              <div class="bg-cream rounded-xl p-6 mb-8">
                <h2 class="font-display text-2xl font-bold text-primary mb-4">Ingredientes</h2>
                <template x-if="typeof receita.ingredientes === 'object' && receita.ingredientes.esponja">
                  <div>
                    <template x-if="receita.total_farinha">
                      <p class="text-sm text-gray-600 mb-3 italic" x-text="'Total de farinha: ' + receita.total_farinha"></p>
                    </template>
                    <template x-for="(grupo, nome) in receita.ingredientes" :key="nome">
                      <div class="mb-4">
                        <h3 class="font-bold text-primary capitalize mb-2" x-text="nome.replace(/_/g, ' ')"></h3>
                        <template x-for="(qtd, item) in grupo" :key="item">
                          <div class="flex justify-between py-1 border-b border-cream">
                            <span class="capitalize" x-text="item.replace(/_/g, ' ')"></span>
                            <span class="font-medium text-gray-700" x-text="qtd"></span>
                          </div>
                        </template>
                      </div>
                    </template>
                  </div>
                </template>
                <template x-if="typeof receita.ingredientes === 'object' && !receita.ingredientes.esponja">
                  <div>
                    <template x-for="(qtd, item) in receita.ingredientes" :key="item">
                      <div class="flex justify-between py-2 border-b border-cream last:border-0">
                        <span class="capitalize" x-text="item.replace(/_/g, ' ')"></span>
                        <span class="font-medium text-gray-700" x-text="qtd"></span>
                      </div>
                    </template>
                  </div>
                </template>
              </div>

              <!-- Modo de Preparo -->
              <div class="mb-8">
                <h2 class="font-display text-2xl font-bold text-primary mb-4">Modo de Preparo</h2>
                <p class="text-gray-700 leading-relaxed whitespace-pre-line" x-text="receita.modo_preparo"></p>
              </div>

              <!-- Observacoes -->
              <template x-if="receita.observacoes">
                <div class="bg-yellow-50 border-l-4 border-yellow-400 p-4 rounded-r-lg">
                  <h3 class="font-bold text-yellow-800 mb-1">Observacoes</h3>
                  <p class="text-yellow-700" x-text="receita.observacoes"></p>
                </div>
              </template>
            </div>
          </article>
        </div>
      </template>
      <template x-if="!receita">
        <div class="text-center py-20">
          <h2 class="font-display text-2xl text-gray-500">Receita nao encontrada</h2>
          <a href="#/receitas" class="text-accent hover:text-primary mt-4 inline-block">Voltar para receitas</a>
        </div>
      </template>
    </div>
  </template>

  <!-- PAGE: SOBRE -->
  <template x-if="$store.router.current === 'sobre'">
    <div class="max-w-4xl mx-auto px-4 py-12">
      <h1 class="font-display text-4xl font-bold text-primary mb-8">Sobre o Curso</h1>
      <div class="bg-white rounded-2xl shadow-lg p-8">
        <p class="text-gray-700 leading-relaxed mb-6">
          Este site foi criado com o objetivo de ajudar os colegas de curso, disponibilizando as receitas passadas em sala de aula no curso de panificacao do CEI de Quintino.
        </p>
        <p class="text-gray-700 leading-relaxed mb-6">
          O curso acontece na Escola de Hotelaria, de segunda a quinta das 13h as 16h.
        </p>
        <p class="text-gray-700 leading-relaxed mb-6">
          As receitas sao apresentadas em porcentagem para facilitar os calculos. Caso tenha duvidas sobre como calcular porcentagem, assista ao video explicativo.
        </p>
        <div class="bg-cream rounded-xl p-6 mt-8">
          <h2 class="font-display text-xl font-bold text-primary mb-2">Os Calculos</h2>
          <p class="text-gray-600">Para efetuar os calculos aplicados nas receitas voce deve usar a porcentagem.</p>
        </div>
      </div>
    </div>
  </template>

  <!-- PAGE: CONTATO -->
  <template x-if="$store.router.current === 'contato'">
    <div class="max-w-4xl mx-auto px-4 py-12">
      <h1 class="font-display text-4xl font-bold text-primary mb-8">Contato</h1>
      <div class="bg-white rounded-2xl shadow-lg p-8">
        <p class="text-gray-700 leading-relaxed mb-6">
          Este site foi feito por Isaac Angelo. Se quiser ver outros sites de sua autoria, acesse o portfolio.
        </p>
        <div class="bg-cream rounded-xl p-6">
          <h2 class="font-display text-xl font-bold text-primary mb-4">Links</h2>
          <a href="https://isaacangelo.dev" target="_blank" class="text-accent hover:text-primary transition-colors">
            Portfolio de Isaac Angelo &rarr;
          </a>
        </div>
      </div>
    </div>
  </template>

  <!-- FOOTER -->
  <footer class="bg-primary text-white py-8 mt-16">
    <div class="max-w-6xl mx-auto px-4 text-center">
      <p class="text-cream text-sm">
        Receitas CEI - Curso de Panificacao de Quintino
      </p>
      <p class="text-cream opacity-70 text-xs mt-2">
        Desenvolvido por Isaac Angelo
      </p>
    </div>
  </footer>

</body>
</html>
